<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CI/CD Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background-color: black;
      color: white;
      text-align: center;
    }
    main {
      padding: 40px 24px;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin-bottom: 12px; }
    p { font-size: 1.15rem; line-height: 1.6; }
    .label {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>CI/CD Pipeline Successful!</h1>
    <p>This website is deployed on AWS Elastic Beanstalk.</p>
    <p>GitHub → AWS CodePipeline → Elastic Beanstalk</p>
    <span class="label">Background color: Blue</span>
  </main>
</body>
</html>
